name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff
      - name: Lint
        run: ruff check peyes tests

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: pip install -e .
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: TEMP kaleido smoke test (kaleido-ci-smoketest branch only)
        run: |
          timeout 90 python -c "
          import time
          import kaleido
          import plotly.graph_objects as go
          t0 = time.time()
          kaleido.get_chrome_sync()
          print(f'get_chrome_sync() done in {time.time() - t0:.2f}s', flush=True)
          fig = go.Figure(data=[go.Scatter(y=[1, 3, 2])])
          t0 = time.time()
          fig.write_image('smoke_test.png')
          print(f'write_image() SUCCESS in {time.time() - t0:.2f}s', flush=True)
          "
